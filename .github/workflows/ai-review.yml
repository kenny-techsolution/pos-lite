name: AI PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ai-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    name: Tier classify · risk report · escalate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout reviewer code
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/ai-pr-reviewer
          path: reviewer
          # Production: use a deploy key or GitHub App token. Demo: same-org public read.
          token: ${{ secrets.REVIEWER_REPO_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: reviewer/package-lock.json

      - name: Install reviewer deps
        run: npm ci
        working-directory: reviewer

      - name: Mint GitHub App installation token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.REVIEWER_APP_ID }}
          private-key: ${{ secrets.REVIEWER_APP_PRIVATE_KEY }}
        # Required: default GITHUB_TOKEN cannot use event:APPROVE per GitHub policy.
        # The App-issued installation token bypasses that limitation, so the
        # reviewer can post real APPROVED reviews on T0/T1 PRs from the bot identity.

      - name: Run AI reviewer
        env:
          # Override the default GITHUB_TOKEN with the App's installation token —
          # short-lived (1h), scoped to pos-lite, identity = ai-pr-reviewer-kc[bot].
          # This is what enables event:APPROVE to succeed.
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          # LLM provider — set ONE of these. The reviewer auto-detects.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          # Optional: explicit provider selection (anthropic | openrouter)
          LLM_PROVIDER: ${{ vars.LLM_PROVIDER }}
          # Optional: per-role model overrides (forces OpenRouter when set)
          MODEL_CLASSIFIER: ${{ vars.MODEL_CLASSIFIER }}
          MODEL_AGENT: ${{ vars.MODEL_AGENT }}
          MODEL_AGENT_OPUS: ${{ vars.MODEL_AGENT_OPUS }}
          # Slack webhooks — set per channel for tier-aware routing.
          # The aggregator picks `#payments-review` for payments/billing, `#security`
          # for auth/crypto, and the URL fallback for everything else.
          SLACK_WEBHOOK_PAYMENTS: ${{ secrets.SLACK_WEBHOOK_PAYMENTS }}
          SLACK_WEBHOOK_SECURITY: ${{ secrets.SLACK_WEBHOOK_SECURITY }}
          SLACK_WEBHOOK_URL:      ${{ secrets.SLACK_WEBHOOK_URL }}
        run: npm run review
        working-directory: reviewer

      - name: Push event to dashboard (Cloudflare Worker)
        # Sub-5s real-time path: append the event directly to the public
        # dashboard's R2 bucket via the Worker's POST /events endpoint.
        # Skips silently if CF_WORKER_URL or CF_WRITE_TOKEN aren't configured.
        if: success()
        env:
          CF_WORKER_URL: ${{ secrets.CF_WORKER_URL }}
          CF_WRITE_TOKEN: ${{ secrets.CF_WRITE_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${CF_WORKER_URL:-}" ] || [ -z "${CF_WRITE_TOKEN:-}" ]; then
            echo "CF_WORKER_URL or CF_WRITE_TOKEN not set — skipping dashboard push (artifact upload still runs)."
            exit 0
          fi
          EVENT_FILE="reviewer/artifacts/events.jsonl"
          if [ ! -s "$EVENT_FILE" ]; then
            echo "No events.jsonl produced (LLM/auth misconfigured?) — skipping dashboard push."
            exit 0
          fi
          COUNT=$(wc -l < "$EVENT_FILE" | tr -d ' ')
          echo "Posting ${COUNT} event(s) to ${CF_WORKER_URL}/events…"
          HTTP_CODE=$(curl -sS -o /tmp/cf-response.txt -w "%{http_code}" \
            -X POST "${CF_WORKER_URL}/events" \
            -H "Authorization: Bearer ${CF_WRITE_TOKEN}" \
            -H "Content-Type: application/x-ndjson" \
            --data-binary @"${EVENT_FILE}")
          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
            echo "::warning::Dashboard push returned HTTP ${HTTP_CODE}: $(cat /tmp/cf-response.txt)"
            exit 0  # don't fail the run on a downstream blip — backstop will catch
          fi
          echo "Dashboard updated · response: $(cat /tmp/cf-response.txt)"

      - name: Upload events.jsonl artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reviewer-events-${{ github.event.pull_request.number }}
          path: reviewer/artifacts/events.jsonl
          retention-days: 30
          if-no-files-found: warn
